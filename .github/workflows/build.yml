

name: Build Shahien Taxi APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create . --org com.shahien.taxi --project-name shahien_taxi --platforms=android --no-pub

      - name: Configure Kotlin version
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i "s/version '1.7.10'/version '1.9.24'/" android/settings.gradle
            sed -i 's/version "1.7.10"/version "1.9.24"/' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '1.7.10'/ext.kotlin_version = '1.9.24'/" android/build.gradle
          fi

      - name: Set Android permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET' "$MANIFEST_PATH" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST_PATH"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST_PATH" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST_PATH"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST_PATH" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST_PATH"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shahien-taxi-app
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
