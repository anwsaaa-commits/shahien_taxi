name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: "stable"

      - name: Create Project Structure
        run: |
          flutter create . --org com.shahien.taxi --project-name shahien_taxi --no-pub

      - name: Inject Kotlin Version
        run: |
          python3 -c "
          import os
          path = 'android/build.gradle'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  content = f.read()
              new_content = 'buildscript {\n    ext.kotlin_version = \"1.9.0\"\n}\n' + content
              with open(path, 'w') as f:
                  f.write(new_content)
          "

      - name: Get Dependencies
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Build APK (Debug Mode)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
