name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: "stable"

      - name: Create Project Structure
        run: |
          flutter create . --org com.shahien.taxi --project-name shahien_taxi --no-pub

      - name: Upgrade Gradle and Kotlin Version
        run: |
          sed -i 's/1.7.10/1.8.22/g' android/build.gradle || true
          sed -i 's/1.7.1/1.8.22/g' android/build.gradle || true
          sed -i 's/7.3.0/7.4.2/g' android/build.gradle || true
          sed -i 's/1.7.10/1.8.22/g' android/settings.gradle || true
          sed -i 's/1.7.1/1.8.22/g' android/settings.gradle || true

      - name: Get Dependencies
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Build APK (Debug Mode)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
